              - heading "Forensic Processing" [level=3] [ref=e152]
              - paragraph [ref=e153]: The scanner labels recognized protocol contracts, keeps price provenance, checks configured Sybil and sanctions sources, and resolves available public identity links when the identity provider returns them.
