          - generic [ref=f5e256]: "Client Request (Single or Cluster Batch) │ ▼ ┌─────────────────────────────────────────────────────────────┐ │ Priority 1: Open Blockscout REST APIs (Zero-Auth, Fast) │ │ eth.blockscout.com / base.blockscout.com │ │ arbitrum.blockscout.com / optimism.blockscout │ └──────────────────────────────┬──────────────────────────────┘ │ (If failed or rate-limited) ▼ ┌─────────────────────────────────────────────────────────────┐ │ Priority 2: Etherscan V2 Multi-Chain Gateway │ │ api.etherscan.io/v2/api?chainid=... │ └──────────────────────────────┬──────────────────────────────┘ │ ▼ ┌─────────────────────────────────────────────────────────────┐ │ Parallel Enrichment Pipeline: │ │ • Daily Price + Explicit Spot-Estimate Provenance │ │ • Anti-Spoofing Verified Contract Mapping │ │ • Web3.bio Identity Graph Resolution (Async non-blocking) │ └─────────────────────────────────────────────────────────────┘"
        - generic [ref=f5e257]:
          - generic [ref=f5e258]:
            - generic [ref=f5e259]: Concurrency
            - paragraph [ref=f5e260]: Historical asset-days are deduplicated and sent through DefiLlama batch requests. CoinGecko receives only a small bounded fallback workload. Provider failures remain explicit partial or unavailable results.
